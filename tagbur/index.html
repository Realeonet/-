<style>
:root{--bg:#fdf6e3;--ink:#222;--muted:#666;--line:#e4dccb;--blue:#2f6fdd;--green:#2e9e5b;--orange:#e0883a;--gold:#f5b400}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.75 Heebo,system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:30px;font-weight:900;margin:12px 0 8px;line-height:1.3}
h2{font-size:24px;font-weight:900;margin:8px 0}
p{margin:8px 0}
.center{text-align:center}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px 20px;margin:14px 0;box-shadow:0 4px 0 var(--line)}
.stars{font-size:26px;font-weight:900;color:#b07a00;margin:0}
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:right;background:#fff;color:inherit;font:inherit;border:3px solid var(--line);border-radius:22px;padding:18px 20px;margin:14px 0;cursor:pointer;box-shadow:0 5px 0 var(--line);min-height:88px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.big .ic{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:40px;line-height:1}
.hero{background:linear-gradient(135deg,#2f6fdd,#7b5cf0);color:#fff;border-radius:24px;padding:20px 22px;margin:12px 0 4px;box-shadow:0 6px 0 #1d4fb0}
.hero-hi{font-size:26px;font-weight:900;margin:0}
.hero-stars{font-size:30px;font-weight:900;margin:4px 0}
.hero-next{margin:4px 0 12px;opacity:.95}
.bar{height:16px;background:rgba(255,255,255,.35);border-radius:10px;overflow:hidden}
.fill{display:block;height:100%;background:#ffd23f;border-radius:10px;transition:width .6s}
button:focus-visible,.choice:focus-visible{outline:4px solid #ffd23f;outline-offset:3px}
.big b{font-size:24px;display:block}
.big small{color:var(--muted);font-size:17px}
.btn{font:inherit;font-weight:700;font-size:22px;min-height:58px;padding:12px 22px;border:0;border-radius:18px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 4px 0 #1d4fb0;margin:8px 0;width:100%}
.btn.alt{background:#fff;color:var(--blue);border:3px solid var(--blue);box-shadow:none}
.btn:active{transform:translateY(2px)}
.speak{font:inherit;font-size:22px;font-weight:700;background:#fff3c4;color:var(--ink);border:3px solid var(--gold);border-radius:999px;padding:10px 20px;cursor:pointer;margin:6px 0;min-height:52px}
.en{font-family:'Atkinson Hyperlegible',Heebo,sans-serif;direction:ltr;letter-spacing:.05em}
.progress{display:flex;gap:8px;margin:6px 0 4px}
.progress span{flex:1;height:14px;border-radius:8px;background:var(--line)}
.progress span.done{background:var(--green)}
.progress span.now{background:var(--gold)}
.count{color:var(--muted);font-size:17px;margin:0 0 10px}
.big-word{font-size:56px;text-align:center;margin:10px 0;line-height:1.2}
.prompt{font-size:22px;font-weight:700;text-align:center;margin:10px 0}
.sentence{font-size:28px;font-weight:700;text-align:center;direction:ltr;font-family:'Atkinson Hyperlegible',Heebo,sans-serif;margin:12px 0}
.choices{display:grid;gap:12px;margin-top:14px}
.choice{font:inherit;font-size:22px;min-height:66px;padding:12px 14px;border-radius:18px;border:3px solid #cfc6b2;background:#fff;color:var(--ink);cursor:pointer}
.choice.ok{background:#d9f5e3;border-color:var(--green)}
.choice.nope{background:#fde7d3;border-color:var(--orange);opacity:.6}
.choice:disabled{cursor:default}
.msg{min-height:38px;font-size:24px;font-weight:700;text-align:center;margin:10px 0 0}
.hint{font-size:20px;color:var(--muted);text-align:center;margin:6px 0 0;min-height:30px}
.slots{display:flex;gap:6px;justify-content:center;direction:ltr;flex-wrap:wrap;margin:14px 0}
.slot{width:54px;height:66px;border-bottom:4px solid var(--ink);font:700 38px 'Atkinson Hyperlegible',sans-serif;display:flex;align-items:center;justify-content:center}
.tiles{display:flex;gap:10px;justify-content:center;direction:ltr;flex-wrap:wrap;margin-top:12px}
.tile{width:62px;height:62px;border-radius:16px;border:0;background:#c9e0ff;font:700 32px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;box-shadow:0 4px 0 #8fb6ea;color:var(--ink)}
.tile:disabled{visibility:hidden}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row .speak,.row .btn{width:auto;margin:6px 0}
.story{font-size:22px;line-height:2;background:#f3f8ff;border-radius:16px;padding:14px 18px;margin:10px 0}
.shake{animation:shake .4s}
.pop{animation:pop .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.grade{font:inherit;font-size:22px;font-weight:700;min-height:56px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.grade.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pin{font:inherit;font-size:24px;width:100%;padding:12px 14px;border:3px solid var(--line);border-radius:14px;margin:8px 0 14px;background:#fff;color:var(--ink)}
ul{padding-right:22px}
li{margin:6px 0}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
</style>
</head>

// חשבונות: לכל ילד/ה יש שם, קוד סודי והתקדמות משלו
function load(){
  try{
    return {accounts:[], ...JSON.parse(localStorage.getItem(KEY) || '{}')};
  }catch{
    return {accounts:[]};
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch{}
}
const store = load();
let me = null; // החשבון שנכנס עכשיו

// ===================================================================
// עזרים
// ===================================================================
function h(tag, props, ...kids){
  const e = Object.assign(document.createElement(tag), props || {});
  e.append(...kids.flat().filter(k => k != null));
  return e;
}
function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function say(text, lang = 'en-US'){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}
const app = document.querySelector('#app');
function view(...nodes){
  app.replaceChildren(...nodes);
  window.scrollTo(0, 0);
}
function big(icon, title, sub, onclick, color = '#fff3c4'){
  const ic = h('span', {className:'ic', textContent:icon});
  ic.style.background = color;
  return h('button', {className:'big', onclick},
    ic,
    h('span', {}, h('b', {textContent:title}), h('small', {textContent:sub})));
}
function badgeText(){
  const cur = BADGES.filter(b => me.stars >= b.at).pop();
  const next = BADGES.find(b => b.at > me.stars);
  const now = cur ? cur.name : '🐣 התואר הראשון מחכה לך';
  return next ? `${now} · עוד ${next.at - me.stars} כוכבים עד ${next.name}` : now;
}

// ===================================================================
// מסכים
// ===================================================================
// מסך בחירת חשבון
function accountsScreen(){
  me = null;
  view(
    h('h1', {textContent:'מי לומד היום? 👋'}),
    ...store.accounts.map(a => big('👤', a.name, `כיתה ${gradeName(a.grade)} · ⭐ ${a.stars} כוכבים`, () => login(a))),
    store.accounts.length ? null : h('p', {className:'center', textContent:'עוד אין חשבונות. בוא ניצור אחד!'}),
    h('button', {className:'btn', textContent:'➕ חשבון חדש', onclick:newAccount}),
  );
}

function login(a){
  const pin = h('input', {type:'password', inputMode:'numeric', maxLength:4, placeholder:'קוד סודי (4 ספרות)', className:'pin'});
  const msg = h('p', {className:'msg'});
  const go = () => {
    if(pin.value === a.pin){
      me = a;
      home();
    }else{
      msg.textContent = '🤔 הקוד לא נכון, נסה שוב';
      pin.value = '';
      pin.classList.add('shake');
      setTimeout(() => pin.classList.remove('shake'), 400);
    }
  };
  pin.onkeydown = e => { if(e.key === 'Enter') go(); };
  view(
    h('button', {className:'btn alt', textContent:'⬅ חזרה', onclick:accountsScreen}),
    h('h1', {textContent:`היי ${a.name}!`}),
    h('div', {className:'card'},
      h('p', {textContent:'הקלד את הקוד הסודי שלך'}),
      pin,
      h('button', {className:'btn', textContent:'כניסה ✨', onclick:go}),
      msg),
  );
  pin.focus();
}

function newAccount(){
  const name = h('input', {placeholder:'שם', maxLength:20, className:'pin'});
  const pin = h('input', {type:'password', inputMode:'numeric', maxLength:4, placeholder:'קוד סודי (4 ספרות)', className:'pin'});
  const msg = h('p', {className:'msg'});
  let chosen = null;
  const create = () => {
    const n = name.value.trim();
    if(!chosen){ msg.textContent = 'בחר/י כיתה'; return; }
    if(!n){ msg.textContent = 'צריך לכתוב שם'; return; }
    if(!/^\d{4}$/.test(pin.value)){ msg.textContent = 'הקוד צריך להיות 4 ספרות'; return; }
    if(store.accounts.some(a => a.name === n)){ msg.textContent = 'כבר יש חשבון בשם הזה'; return; }
    const a = {id:Date.now().toString(36), name:n, grade:chosen, pin:pin.value, stars:0, rounds:0, missed:{}};
    store.accounts.push(a);
    save();
    me = a;
    home();
  };
  view(
    h('button', {className:'btn alt', textContent:'⬅ חזרה', onclick:accountsScreen}),
    h('h1', {textContent:'חשבון חדש ✨'}),
    h('div', {className:'card'},
      h('p', {textContent:'שם הילד/ה'}),
      name,
      h('p', {textContent:'באיזו כיתה?'}),
      gradePicker(null, n => { chosen = n; }),
      h('p', {textContent:'קוד סודי (4 ספרות). שמרו אותו, הוא נדרש בכל כניסה'}),
      pin,
      h('button', {className:'btn', textContent:'צור חשבון', onclick:create}),
      msg),
  );
  name.focus();
}

// אחוז ההתקדמות אל התואר הבא
function progressPct(){
  const prev = BADGES.filter(b => me.stars >= b.at).pop()?.at || 0;
  const next = BADGES.find(b => b.at > me.stars);
  return next ? (me.stars - prev) / (next.at - prev) * 100 : 100;
}

function gradePicker(current, onPick){
  const btns = GRADES.map(g => h('button', {className:'grade' + (g.n === current ? ' on' : ''), textContent:g.name, onclick:() => {
    btns.forEach(b => b.classList.remove('on'));
    btns[g.n - 1].classList.add('on');
    onPick(g.n);
  }}));
  return h('div', {className:'grades'}, btns);
}

function changeGrade(){
  view(
    h('button', {className:'btn alt', textContent:'⬅ חזרה', onclick:home}),
    h('h1', {textContent:'באיזו כיתה?'}),
    gradePicker(me.grade, n => { me.grade = n; save(); home(); }),
  );
}

function home(){
  round = null;
  if(!me) return accountsScreen();
  view(
    h('div', {className:'hero'},
      h('p', {className:'hero-hi', textContent:`שלום ${me.name} 👋`}),
      h('p', {className:'hero-stars', textContent:`⭐ ${me.stars} כוכבים`}),
      h('p', {className:'hero-next', textContent:badgeText()}),
      h('div', {className:'bar'}, (() => { const f = h('span', {className:'fill'}); f.style.width = progressPct() + '%'; return f; })())),
    big('🇬🇧', 'אנגלית', 'לשמוע, לכתוב ולהשלים משפטים', () => startRound('en'), '#ffd6e0'),
    big('📜', 'תנ״ך', 'סיפורים ושאלות', () => startRound('tanakh'), '#d6e8ff'),
    big('🔬', 'מדעים', 'נושאים קצרים ושאלות', () => startRound('science'), '#d8f5dc'),
    big('➗', 'מתמטיקה', 'כפל, שברים, שטחים ועוד', () => startRound('math'), '#ffe8c2'),
    big('✍️', 'עברית', 'דקדוק, פיסוק ואוצר מילים', () => startRound('hebrew'), '#e6dcff'),
    big('👨‍👩‍👧', 'למבוגרים', 'התקדמות ומילים לחזרה', parents, '#eeeeee'),
    h('button', {className:'btn alt', textContent:`🎓 כיתה ${gradeName(me.grade)} (שינוי)`, onclick:changeGrade}),
    h('button', {className:'btn alt', textContent:'🔄 החלף חשבון', onclick:accountsScreen}),
  );
}

function parents(){
  const missed = Object.values(me.missed).sort((a, b) => b.n - a.n);
  view(
    h('button', {className:'btn alt', textContent:'⬅ חזרה', onclick:home}),
    h('h1', {textContent:'למבוגרים 👨‍👩‍👧'}),
    h('div', {className:'card'},
      h('p', {textContent:`⭐ כוכבים: ${me.stars}`}),
      h('p', {textContent:`🏁 סיבובים שהושלמו: ${me.rounds}`})),
    h('div', {className:'card'},
      h('h2', {textContent:'לחזרה בבית'}),
      missed.length
        ? h('ul', {}, missed.map(m => h('li', {textContent:`${m.label} (טעויות: ${m.n})`})))
        : h('p', {textContent:'אין כרגע מילים לחזרה. מעולה! 🎉'})),
    h('div', {className:'card'},
      h('p', {textContent:'להוספת מילים, משפטים או סיפורים: פותחים את הקובץ index.html ומעדכנים את המערכים WORDS, SENTENCES ו-BIBLE בתחילת הקוד.'})),
    h('p', {className:'center'}, h('a', {href:'privacy.html', textContent:'מדיניות פרטיות'})),
    h('button', {className:'btn alt', textContent:'איפוס התקדמות', onclick:() => {
      if(confirm(`למחוק את כל ההתקדמות של ${me.name}?`)){
        Object.assign(me, {stars:0, rounds:0, missed:{}});
        save();
        home();
      }
    }}),
  );
}

// ===================================================================
// סיבוב: 5 שאלות, כוכב על כל תשובה נכונה מהניסיון הראשון
// ===================================================================
let round = null;

function startRound(subject){
  const build = {en:englishRound, tanakh:tanakhRound, science:scienceRound, math:mathRound, hebrew:hebrewRound}[subject];
  const items = build(me.grade);
  if(!items) return noContent(subject);
  round = {subject, items, i:0, stars:0};
  showItem();
}

function noContent(subject){
  const name = {en:'באנגלית', tanakh:'בתנ״ך', science:'במדעים', math:'במתמטיקה', hebrew:'בעברית'}[subject];
  view(
    h('button', {className:'btn alt', textContent:'⬅ חזרה לתפריט', onclick:home}),
    h('div', {className:'card center'},
      h('h2', {textContent:`עוד אין תוכן ${name} לכיתה ${gradeName(me.grade)}`}),
      h('p', {textContent:'התוכן לכיתה הזו יתווסף בהמשך.'})),
  );
}

function showItem(){
  const r = round;
  if(r.i >= r.items.length) return finish();

  const item = r.items[r.i];
  const box = h('div', {className:'card'});
  view(
    h('button', {className:'btn alt', textContent:'⬅ יציאה לתפריט', onclick:home}),
    h('p', {className:'count', textContent:`שאלה ${r.i + 1} מתוך ${r.items.length}`}),
    h('div', {className:'progress'}, r.items.map((_, k) =>
      h('span', {className: k < r.i ? 'done' : k === r.i ? 'now' : ''}))),
    box,
  );

  const next = firstTry => {
    if(firstTry){
      me.stars++;
      r.stars++;
      delete me.missed[item.key];
    }else{
      const m = me.missed[item.key] || {label:item.label, n:0};
      m.n++;
      me.missed[item.key] = m;
    }
    save();
    box.append(h('p', {className:'msg pop', textContent: firstTry ? '⭐ מעולה! +1 כוכב' : '💪 בסדר, לומדים מזה!'}));
    setTimeout(() => {
      if(round === r){
        r.i++;
        showItem();
      }
    }, firstTry ? 900 : 1600);
  };

  const renderers = {listen:listenItem, spell:spellItem, sentence:sentenceItem, bible:bibleItem};
  renderers[item.kind](box, item, next);
}

function finish(){
  const r = round;
  round = null;
  me.rounds++;
  save();
  view(
    h('div', {className:'card center'},
      h('h1', {textContent:'סיבוב גמור! 🎉'}),
      h('p', {className:'stars', textContent:`קיבלת ${r.stars} כוכבים מתוך ${r.items.length}`}),
      h('p', {textContent:badgeText()})),
    breakCard(),
    h('button', {className:'btn', textContent:'עוד סיבוב 🚀', onclick:() => startRound(r.subject)}),
    h('button', {className:'btn alt', textContent:'לתפריט', onclick:home}),
  );
}

function breakCard(){
  const out = h('p', {className:'center', textContent:'דקה אחת, ואז חוזרים 💪'});
  let secs = 60;
  let timer = null;
  const start = h('button', {className:'speak', textContent:'⏱️ התחל דקת הפסקה', onclick() {
    this.disabled = true;
    out.textContent = `נשארו ${secs} שניות`;
    timer = setInterval(() => {
      secs--;
      out.textContent = secs > 0 ? `נשארו ${secs} שניות` : 'נגמרה ההפסקה! מוכנים? 💪';
      if(secs <= 0) clearInterval(timer);
    }, 1000);
  }});
  return h('div', {className:'card center'},
    h('h2', {textContent:'הפסקת תנועה'}),
    h('p', {textContent:pick(BREAKS)}),
    start,
    out);
}

const pick = a => a[Math.random() * a.length | 0];

// ===================================================================
// סוגי שאלות
// ===================================================================

// בחירה מתוך כמה כפתורים. מחזיר done(firstTry) כשנגמר.
function choose(box, options, correct, done){
  let misses = 0, finished = false;
  const msg = h('p', {className:'msg'});
  const buttons = options.map(o => {
    const b = h('button', {className:'choice', textContent:o.label});
    b.onclick = () => {
      if(finished || b.disabled) return;
      if(o.v === correct){
        b.classList.add('ok');
        end(misses === 0);
      }else{
        misses++;
        b.classList.add('nope');
        b.disabled = true;
        if(misses < 2){
          msg.textContent = '🤔 כמעט! נסה שוב';
        }else{
          msg.textContent = '👀 התשובה הנכונה מסומנת בירוק';
          end(false);
        }
      }
    };
    return {b, v:o.v};
  });
  const end = first => {
    finished = true;
    buttons.forEach(x => {
      x.b.disabled = true;
      if(x.v === correct) x.b.classList.add('ok');
    });
    done(first);
  };
  box.append(h('div', {className:'choices'}, buttons.map(x => x.b)), msg);
}

// שמיעת מילה באנגלית ובחירת המשמעות בעברית
function listenItem(box, item, done){
  const w = item.word;
  box.append(
    h('p', {className:'big-word en', textContent:w.en}),
    h('p', {className:'prompt', textContent:'מה זה בעברית?'}),
    h('div', {className:'center'},
      h('button', {className:'speak', textContent:'🔊 שמע שוב', onclick:() => say(w.en)})),
  );
  setTimeout(() => say(w.en), 300);
  const options = shuffle([w, ...shuffle(item.pool.filter(x => x !== w)).slice(0, 2)])
    .map(x => ({v:x.en, label:`${x.emoji} ${x.he}`}));
  choose(box, options, w.en, done);
}

// רואים תמונה ומרכיבים את האיות מאותיות
function spellItem(box, item, done){
  const w = item.word;
  const letters = [...w.en];
  const extra = shuffle([...LETTERS].filter(c => !letters.includes(c))).slice(0, 3);
  const tiles = shuffle([...letters, ...extra]).map(ch => ({ch, el:h('button', {className:'tile', textContent:ch})}));
  const slots = letters.map(() => h('div', {className:'slot'}));
  const stack = [];
  const msg = h('p', {className:'msg'});
  let misses = 0, finished = false;

  const finishWith = first => {
    finished = true;
    tiles.forEach(t => t.el.disabled = true);
    slots.forEach((s, k) => s.textContent = letters[k]);
    say(w.en);
    done(first);
  };

  const check = () => {
    const guess = stack.map(x => x.ch).join('');
    if(guess === w.en){
      msg.textContent = '✅ יפה!';
      finishWith(misses === 0);
      return;
    }
    misses++;
    msg.textContent = '🤔 כמעט! שמע שוב 🔊';
    slots.forEach(s => s.classList.add('shake'));
    setTimeout(() => slots.forEach(s => s.classList.remove('shake')), 400);
    if(misses >= 2){
      msg.textContent = '👀 כך כותבים את המילה:';
      finishWith(false);
      return;
    }
    setTimeout(clear, 700);
  };

  const clear = () => {
    while(stack.length) undo();
  };

  const undo = () => {
    const last = stack.pop();
    if(!last) return;
    last.tile.el.disabled = false;
    slots[stack.length].textContent = '';
  };

  tiles.forEach(t => {
    t.el.onclick = () => {
      if(finished || stack.length >= letters.length) return;
      stack.push({ch:t.ch, tile:t});
      t.el.disabled = true;
      slots[stack.length - 1].textContent = t.ch;
      if(stack.length === letters.length) check();
    };
  });

  box.append(
    h('div', {className:'big-word', textContent:w.emoji}),
    h('p', {className:'prompt', textContent:`איך כותבים באנגלית: "${w.he}"?`}),
    h('div', {className:'center'},
      h('button', {className:'speak', textContent:'🔊 שמע את המילה', onclick:() => say(w.en)})),
    h('div', {className:'slots'}, slots),
    h('div', {className:'tiles'}, tiles.map(t => t.el)),
    h('div', {className:'row'},
      h('button', {className:'speak', textContent:'⌫ מחק אות', onclick:() => { if(!finished) undo(); }})),
    msg,
  );
  setTimeout(() => say(w.en), 300);
}

// השלמת משפט באנגלית
function sentenceItem(box, item, done){
  const hint = h('p', {className:'hint', textContent:''});
  box.append(
    h('p', {className:'sentence', textContent:item.s}),
    h('div', {className:'row'},
      h('button', {className:'speak', textContent:'🔊 הקשב', onclick:() => say(item.s.replace('___', '...'))}),
      h('button', {className:'speak', textContent:'💡 רמז בעברית', onclick(){ hint.textContent = item.he; this.disabled = true; }})),
    hint,
    h('p', {className:'prompt', textContent:'איזו מילה חסרה?'}),
  );
  choose(box, shuffle(item.opts).map(o => ({v:o, label:o})), item.a, done);
}

// סיפור תנ"ך ושאלה עליו
function bibleItem(box, item, done){
  const b = item.b;
  box.append(
    h('p', {className:'big-word', textContent:b.emoji}),
    h('h2', {className:'center', textContent:b.title}),
    h('div', {className:'story', textContent:b.text}),
    h('div', {className:'row'},
      h('button', {className:'speak', textContent:'🔊 הקשב לסיפור', onclick:() => say(b.text, 'he-IL')})),
    h('p', {className:'prompt', textContent:b.q}),
  );
  choose(box, shuffle(b.opts).map(o => ({v:o, label:o})), b.a, done);
}

// ===================================================================
// בניית סיבובים
// ===================================================================
function englishRound(grade){
  const c = CONTENT.en[grade];
  if(!c) return null;
  const w = shuffle(c.words);
  const sent = shuffle(c.sentences)[0];
  const items = [
    {kind:'listen', key:w[0].en, label:w[0].en, word:w[0], pool:c.words},
    {kind:'listen', key:w[1].en, label:w[1].en, word:w[1], pool:c.words},
    {kind:'spell',  key:w[2].en, label:w[2].en, word:w[2]},
    {kind:'spell',  key:w[3].en, label:w[3].en, word:w[3]},
    {kind:'sentence', key:'s:' + c.sentences.indexOf(sent), label:sent.s, ...sent},
  ];
  return shuffle(items);
}

function storyRound(subject, grade){
  const c = CONTENT[subject][grade];
  if(!c) return null;
  return shuffle(c.stories).slice(0, 5).map(b => ({kind:'bible', key:subject + ':' + b.title, label:b.title, b}));
}
const tanakhRound = grade => storyRound('tanakh', grade);
const scienceRound = grade => storyRound('science', grade);
const mathRound = grade => storyRound('math', grade);
const hebrewRound = grade => storyRound('hebrew', grade);

// ===================================================================
// התחלה
// ===================================================================
// שירות עבודה מופעל רק באתר מאובטח (HTTPS) או ב-localhost, ומאפשר שימוש לא מקוון
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
home();
</script>
