<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minkin</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d6336c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Оформление по умолчанию — светлое; тёмное — по системе или выбором темы. */
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #1d2330;
  --muted: #6b7280;
  --accent: #d6336c;
  --accent-soft: #fde7ef;
  --border: #e3e6ec;
  --radius: 16px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #14171f;
    --card: #1e222c;
    --text: #e8eaf0;
    --muted: #9aa1b2;
    --accent: #ff6b9a;
    --accent-soft: #3a2230;
    --border: #2d3340;
    color-scheme: dark;
  }
}

:root[data-theme=dark] {
  --bg: #14171f;
  --card: #1e222c;
  --text: #e8eaf0;
  --muted: #9aa1b2;
  --accent: #ff6b9a;
  --accent-soft: #3a2230;
  --border: #2d3340;
  color-scheme: dark;
}

:root[data-theme=pink] {
  --bg: #fff4f8;
  --card: #ffffff;
  --text: #4a1d33;
  --muted: #a06a84;
  --accent: #e0519a;
  --accent-soft: #ffe3f0;
  --border: #f6cfe2;
  color-scheme: light;
}

:root[data-theme=mint] {
  --bg: #effbf5;
  --card: #ffffff;
  --text: #173d30;
  --muted: #5d8a79;
  --accent: #1f9d6b;
  --accent-soft: #d9f5e8;
  --border: #cdeee0;
  color-scheme: light;
}

:root[data-theme=sky] {
  --bg: #eef6ff;
  --card: #ffffff;
  --text: #17324d;
  --muted: #5f7d99;
  --accent: #2f7fd1;
  --accent-soft: #dcecff;
  --border: #cfe2f7;
  color-scheme: light;
}

:root[data-theme=violet] {
  --bg: #f6f3ff;
  --card: #ffffff;
  --text: #2d1f4d;
  --muted: #7a6c99;
  --accent: #7c4dd6;
  --accent-soft: #ece3ff;
  --border: #e0d5f7;
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.45;
}

[hidden] {
  display: none !important;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.app-header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.brand h1 {
  font-size: 1.4rem;
  margin: 0;
}

.tagline {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
}

.header-tools {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

/* Выбор языка интерфейса: отдельная «таблетка» с глобусом. */
.ui-pick {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px 4px 12px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--border);
}

.ui-pick select {
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  padding: 4px 6px;
  cursor: pointer;
}

/* Цветовые темы — кружки. */
.themes {
  display: flex;
  gap: 8px;
}

.swatch {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--border);
  padding: 0;
  cursor: pointer;
}

.swatch.is-active {
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.card h2 {
  font-size: 1.1rem;
  margin: 0 0 12px;
}

/* Выбор языков: «откуда → куда» с поменяться посередине. */
.lang-card {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 10px;
}

.lang-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.lang-label {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.lang-select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px solid var(--accent);
  background: var(--accent-soft);
  color: var(--text);
  font: inherit;
  font-size: 1rem;
  font-weight: 600;
}

.swap {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 0;
  background: var(--accent);
  color: #fff;
  font-size: 1.3rem;
  cursor: pointer;
  align-self: end;
}

.share {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.hint {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 0.9rem;
}

.rec-audio {
  width: 100%;
  margin-top: 12px;
}

/* Режим озвучки: переключатель-пилюля. */
.mode-chips {
  display: flex;
  gap: 0;
  margin-bottom: 12px;
  padding: 4px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--border);
}

.mode-chips .chip {
  flex: 1;
  border: 0;
  border-radius: 999px;
  text-align: center;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 999px;
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
  white-space: nowrap;
}

.chip.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

a.chip {
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.mic {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 24px 12px;
  margin-bottom: 16px;
  border: 2px dashed var(--accent);
  border-radius: var(--radius);
  background: var(--accent-soft);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.mic:active {
  transform: scale(0.98);
}

.mic:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.mic-icon {
  font-size: 2.4rem;
  line-height: 1;
}

.mic.is-listening {
  border-style: solid;
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(214, 51, 108, 0.35); }
  50% { box-shadow: 0 0 0 12px rgba(214, 51, 108, 0); }
}

.field-label {
  display: block;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 6px;
}

textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 1.05rem;
  resize: vertical;
  margin-bottom: 10px;
}

textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.btn {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
}

.btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

/* Главное действие — заполненная кнопка, остальные — контурные или мягкие. */
.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-secondary {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}

.btn-soft {
  background: var(--accent-soft);
  color: var(--accent);
}

.btn-record.is-recording {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.result {
  margin-top: 16px;
  padding: 16px;
  border-radius: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
}

.result-source {
  color: var(--muted);
  margin: 0 0 6px;
}

.result-target {
  font-size: 1.4rem;
  font-weight: 600;
  margin: 0 0 14px;
}

.status {
  min-height: 1.2em;
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 0.95rem;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.phrase-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.phrase {
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--border);
}

.phrase:first-child {
  border-top: 0;
}

.phrase-pick {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 12px 4px;
  border: 0;
  background: transparent;
  color: var(--text);
  text-align: start;
  font: inherit;
  cursor: pointer;
  min-width: 0;
}

.phrase-target {
  color: var(--accent);
  font-size: 0.95rem;
}

.icon-btn {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 0;
  background: var(--accent-soft);
  color: var(--accent);
  cursor: pointer;
  font-size: 0.9rem;
}

.footer-note {
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
  margin: 8px 0 24px;
}

.footer-note a {
  color: var(--accent);
}

@media (max-width: 420px) {
  .lang-card {
    grid-template-columns: 1fr;
  }
  .swap {
    justify-self: center;
    align-self: center;
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="app-header">
    <div class="brand">
      <h1 data-i18n="appTitle">Minkin · Переводчик</h1>
      <p class="tagline" data-i18n="tagline">Звук на звук</p>
    </div>
    <div class="header-tools">
      <label class="ui-pick"><span aria-hidden="true">🌐</span><select id="ui-lang" data-i18n-aria="uiLang"></select></label>
      <div class="themes" id="themes" role="radiogroup" data-i18n-aria="themeLabel"></div>
    </div>
  </header>

  <section class="card lang-card">
    <div class="lang-box">
      <span class="lang-label" data-i18n="inputLabel">Язык ввода</span>
      <select id="input-lang" class="lang-select" data-i18n-aria="inputLabel"></select>
    </div>
    <button type="button" id="swap-btn" class="swap" data-i18n-aria="swap" aria-label="Поменять местами">⇄</button>
    <div class="lang-box">
      <span class="lang-label" data-i18n="outputLabel">Язык перевода</span>
      <select id="output-lang" class="lang-select" data-i18n-aria="outputLabel"></select>
    </div>
  </section>

  <section class="card">
    <div class="chips mode-chips" id="mode-chips" role="radiogroup" data-i18n-aria="modeLabel"></div>
    <button type="button" id="mic" class="mic">
      <span class="mic-icon" aria-hidden="true">🎙</span>
      <span id="mic-label"></span>
    </button>

    <label class="field-label" for="source-text" data-i18n="textLabel">Ваш текст</label>
    <textarea id="source-text" rows="3" data-i18n-placeholder="textPlaceholder"></textarea>
    <button type="button" id="translate-btn" class="btn btn-primary" data-i18n="translate">Перевести</button>

    <div id="result" class="result" hidden>
      <p class="result-source" id="result-source" dir="auto"></p>
      <p class="result-target" id="result-target"></p>
      <button type="button" id="play-btn" class="btn btn-soft" data-i18n="play">▶ Воспроизвести</button>
      <div class="share">
        <button type="button" id="share-native" class="chip" data-i18n="share">Поделиться</button>
        <button type="button" id="share-copy" class="chip" data-i18n="copy">Копировать</button>
      </div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2 data-i18n="phrasebook">Разговорник</h2>
    <div class="filters chips" id="filters"></div>
    <ul class="phrase-list" id="phrase-list"></ul>
  </section>

  <section class="card">
    <h2 data-i18n="recordTitle">Запись</h2>
    <p class="hint" data-i18n="recordHint">Запишите свою фразу, прослушайте и отправьте файлом.</p>
    <button type="button" id="record-btn" class="btn btn-soft btn-record" data-i18n="record">● Записать</button>
    <audio id="rec-audio" class="rec-audio" controls hidden></audio>
    <div class="share">
      <button type="button" id="share-audio" class="chip" data-i18n="shareAudio" hidden>Поделиться записью</button>
      <a id="rec-download" class="chip" data-i18n="download" hidden>Скачать запись</a>
    </div>
  </section>

  <p class="footer-note" data-i18n="footer"></p>
  <p class="footer-note"><a href="privacy.html">Политика конфиденциальности</a></p>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
