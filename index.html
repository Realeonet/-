<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minkin</title>
<style>
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #1d2330;
  --muted: #6b7280;
  --accent: #d6336c;
  --accent-soft: #fde7ef;
  --border: #e3e6ec;
  --radius: 14px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #14171f;
    --card: #1e222c;
    --text: #e8eaf0;
    --muted: #9aa1b2;
    --accent: #ff6b9a;
    --accent-soft: #3a2230;
    --border: #2d3340;
    color-scheme: dark;
  }
}

:root[data-theme=dark] {
  --bg: #14171f;
  --card: #1e222c;
  --text: #e8eaf0;
  --muted: #9aa1b2;
  --accent: #ff6b9a;
  --accent-soft: #3a2230;
  --border: #2d3340;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.45;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.app-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.brand h1 {
  font-size: 1.35rem;
  margin: 0;
}

.tagline {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
}

.share {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 999px;
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
  white-space: nowrap;
}

.chip.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.card h2 {
  font-size: 1.1rem;
  margin: 0 0 12px;
}

.lang-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px;
}

.lang-group {
  flex: 1 1 220px;
  min-width: 0;
}

.lang-label {
  display: block;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 6px;
}

.swap {
  flex: none;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}

.mic {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 24px 12px;
  margin-bottom: 16px;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  background: var(--accent-soft);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.mic:active {
  transform: scale(0.98);
}

.mic:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.mic-icon {
  font-size: 2.4rem;
  line-height: 1;
}

.mic.is-listening {
  border-style: solid;
  border-color: var(--accent);
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(214, 51, 108, 0.35); }
  50% { box-shadow: 0 0 0 12px rgba(214, 51, 108, 0); }
}

.field-label {
  display: block;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 6px;
}

textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 1.05rem;
  resize: vertical;
  margin-bottom: 10px;
}

textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.btn {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
}

.btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-secondary {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}

.result {
  margin-top: 16px;
  padding: 16px;
  border-radius: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
}

.result-source {
  color: var(--muted);
  margin: 0 0 6px;
}

.result-target {
  font-size: 1.4rem;
  font-weight: 600;
  margin: 0 0 14px;
}

.status {
  min-height: 1.2em;
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 0.95rem;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.phrase-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.phrase {
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--border);
}

.phrase:first-child {
  border-top: 0;
}

.phrase-pick {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 12px 4px;
  border: 0;
  background: transparent;
  color: var(--text);
  text-align: start;
  font: inherit;
  cursor: pointer;
  min-width: 0;
}

.phrase-target {
  color: var(--accent);
  font-size: 0.95rem;
}

.icon-btn {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 0.9rem;
}

.footer-note {
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
  margin: 8px 0 24px;
}
</style>
</head>
<body>
<main class="app">
  <header class="app-header">
    <div class="brand">
      <h1 data-i18n="appTitle">Minkin · Переводчик</h1>
      <p class="tagline" data-i18n="tagline">Звук на звук</p>
    </div>
    <div class="chips" id="ui-langs" role="radiogroup" data-i18n-aria="uiLang"></div>
  </header>

  <section class="card">
    <div class="lang-row">
      <div class="lang-group">
        <span class="lang-label" data-i18n="inputLabel">Язык ввода</span>
        <div class="chips" id="input-langs" role="radiogroup" data-i18n-aria="inputLabel"></div>
      </div>
      <button type="button" id="swap-btn" class="swap" data-i18n="swap">⇄ Поменять местами</button>
      <div class="lang-group">
        <span class="lang-label" data-i18n="outputLabel">Язык перевода</span>
        <div class="chips" id="output-langs" role="radiogroup" data-i18n-aria="outputLabel"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <button type="button" id="mic" class="mic">
      <span class="mic-icon" aria-hidden="true">🎙</span>
      <span id="mic-label"></span>
    </button>

    <label class="field-label" for="source-text" data-i18n="textLabel">Ваш текст</label>
    <textarea id="source-text" rows="3" data-i18n-placeholder="textPlaceholder"></textarea>
    <button type="button" id="translate-btn" class="btn btn-secondary" data-i18n="translate">Перевести</button>

    <div id="result" class="result" hidden>
      <p class="result-source" id="result-source" dir="auto"></p>
      <p class="result-target" id="result-target"></p>
      <button type="button" id="play-btn" class="btn btn-primary" data-i18n="play">▶ Воспроизвести</button>
      <div class="share">
        <button type="button" id="share-native" class="chip" data-i18n="share">Поделиться</button>
        <button type="button" id="share-wa" class="chip">WhatsApp</button>
        <button type="button" id="share-mail" class="chip" data-i18n="email">Email</button>
        <button type="button" id="share-copy" class="chip" data-i18n="copy">Копировать</button>
      </div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2 data-i18n="phrasebook">Разговорник</h2>
    <div class="filters chips" id="filters"></div>
    <ul class="phrase-list" id="phrase-list"></ul>
  </section>

  <p class="footer-note" data-i18n="footer"></p>
</main>

  status: document.getElementById('status'),
  filters: document.getElementById('filters'),
  phraseList: document.getElementById('phrase-list'),
};

function t(key) {
  const dict = UI[state.ui] || UI.ru;
  return dict[key] !== undefined ? dict[key] : UI.ru[key];
}

function loadPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem('phrasebook-prefs') || '{}');
    if (UI[saved.ui]) state.ui = saved.ui;
    if (LANGS[saved.source]) state.source = saved.source;
    if (LANGS[saved.target]) state.target = saved.target;
  } catch (error) {
    console.warn(error);
  }
  if (state.source === state.target) {
    state.target = CODES.find((code) => code !== state.source);
  }
}

function savePrefs() {
  try {
    localStorage.setItem('phrasebook-prefs', JSON.stringify({
      ui: state.ui,
      source: state.source,
      target: state.target,
    }));
  } catch (error) {
    console.warn(error);
  }
}

function setStatus(message) {
  el.status.textContent = message;
}

function chipButton(code, active, onClick) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'chip' + (active ? ' is-active' : '');
  btn.setAttribute('role', 'radio');
  btn.setAttribute('aria-checked', String(active));
  btn.textContent = `${LANGS[code].flag} ${LANGS[code].name}`;
  btn.addEventListener('click', onClick);
  return btn;
}

function renderUiLangs() {
  el.uiLangs.innerHTML = '';
  CODES.forEach((code) => {
    el.uiLangs.appendChild(chipButton(code, state.ui === code, () => {
      state.ui = code;
      savePrefs();
      applyUI();
    }));
  });
}

function renderLangChips() {
  el.inputLangs.innerHTML = '';
  el.outputLangs.innerHTML = '';
  CODES.forEach((code) => {
    el.inputLangs.appendChild(chipButton(code, state.source === code, () => setSource(code)));
    el.outputLangs.appendChild(chipButton(code, state.target === code, () => setTarget(code)));
  });
}

function categoryName(id) {
  return id === 'all' ? t('all') : UI[state.ui].categories[id];
}

function renderFilters() {
  el.filters.innerHTML = '';
  ['all', ...CATEGORIES].forEach((id) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (state.filter === id ? ' is-active' : '');
    btn.textContent = categoryName(id);
    btn.addEventListener('click', () => {
      state.filter = id;
      renderFilters();
      renderPhrases();
    });
    el.filters.appendChild(btn);
  });
}

function renderPhrases() {
  const visible = PHRASES.filter((p) => state.filter === 'all' || p.category === state.filter);
  el.phraseList.innerHTML = '';

  visible.forEach((phrase) => {
    const item = document.createElement('li');
    item.className = 'phrase';

    const pick = document.createElement('button');
    pick.type = 'button';
    pick.className = 'phrase-pick';
    pick.setAttribute('aria-label', `${t('showTranslation')}: ${phrase[state.source]}`);

    const source = document.createElement('span');
    source.lang = state.source;
    source.dir = LANGS[state.source].dir;
    source.textContent = phrase[state.source];

    const target = document.createElement('span');
    target.className = 'phrase-target';
    target.lang = state.target;
    target.dir = LANGS[state.target].dir;
    target.textContent = phrase[state.target];

    pick.append(source, target);
    pick.addEventListener('click', () => {
      el.sourceText.value = phrase[state.source];
      showResult(phrase[state.source], phrase[state.target]);
    });

    const play = document.createElement('button');
    play.type = 'button';
    play.className = 'icon-btn';
    play.setAttribute('aria-label', `${t('playAria')}: ${phrase[state.target]}`);
    play.textContent = '▶';
    play.addEventListener('click', () => speak(phrase[state.target], state.target));

    item.append(pick, play);
    el.phraseList.appendChild(item);
  });
}

function updateMicLabel() {
  if (!SpeechRecognitionAPI) {
    el.micLabel.textContent = t('micUnsupported');
  } else {
    el.micLabel.textContent = state.recognizer ? t('micListening') : t('micIdle');
  }
  el.mic.classList.toggle('is-listening', Boolean(state.recognizer));
  el.mic.disabled = !SpeechRecognitionAPI;
}

function applyUI() {
  document.documentElement.lang = state.ui;
  document.documentElement.dir = LANGS[state.ui] && state.ui === 'he' ? 'rtl' : 'ltr';
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach((node) => {
    node.textContent = t(node.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach((node) => {
    node.placeholder = t(node.dataset.i18nPlaceholder);
  });
  document.querySelectorAll('[data-i18n-aria]').forEach((node) => {
    node.setAttribute('aria-label', t(node.dataset.i18nAria));
  });
  renderUiLangs();
  renderLangChips();
  renderFilters();
  renderPhrases();
  updateMicLabel();
}

// Меняет языки. Если сменился язык ввода, старый текст очищается.
function setLanguages(source, target) {
  if (source === target) return;
  const sourceChanged = source !== state.source;
  stopMic();
  state.source = source;
  state.target = target;
  if (sourceChanged) el.sourceText.value = '';
  el.sourceText.lang = source;
  el.sourceText.dir = LANGS[source].dir;
  el.result.hidden = true;
  setStatus('');
  savePrefs();
  renderLangChips();
  renderPhrases();
}

function setSource(code) {
  if (code === state.target) {
    setLanguages(code, state.source);
  } else {
    setLanguages(code, state.target);
  }
}

function setTarget(code) {
  if (code === state.source) {
    setLanguages(state.target, code);
  } else {
    setLanguages(state.source, code);
  }
}

function swapLanguages() {
  const translated = el.result.hidden ? '' : el.resultTarget.textContent;
  setLanguages(state.target, state.source);
  if (translated) el.sourceText.value = translated;
}

function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[.,!?¿¡;:'«»—…-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function findPhrase(text) {
  const query = normalize(text);
  if (!query) return null;
  return PHRASES.find((phrase) => normalize(phrase[state.source]) === query) || null;
}

function showResult(sourceText, targetText) {
  el.resultSource.textContent = sourceText;
  el.resultSource.lang = state.source;
  el.resultSource.dir = LANGS[state.source].dir;
  el.resultTarget.textContent = targetText;
  el.resultTarget.lang = state.target;
  el.resultTarget.dir = LANGS[state.target].dir;
  el.result.hidden = false;
  setStatus('');
}

// Текст для отправки: исходная фраза, перевод и подпись приложения.
function shareText() {
  return `${el.resultSource.textContent}\n${el.resultTarget.textContent}\n\nMinkin`;
}

async function shareNative() {
  try {
    await navigator.share({ title: 'Minkin', text: shareText() });
  } catch (error) {
    if (error.name !== 'AbortError') setStatus(error.message);
  }
}

function shareWhatsApp() {
  window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank', 'noopener');
}

function shareEmail() {
  location.href = `mailto:?subject=${encodeURIComponent('Minkin')}&body=${encodeURIComponent(shareText())}`;
}

async function copyText() {
  try {
    await navigator.clipboard.writeText(shareText());
    setStatus(t('copied'));
  } catch (error) {
    setStatus(t('copyError'));
  }
}

function speak(text, lang) {
  if (!('speechSynthesis' in window)) {
    setStatus(t('ttsUnsupported'));
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = LANGS[lang].speech;
  const voice = speechSynthesis.getVoices().find((v) => v.lang.toLowerCase().startsWith(LANGS[lang].api));
  if (voice) utterance.voice = voice;
  utterance.rate = 0.9;
  speechSynthesis.speak(utterance);
}

async function translate() {
  const text = el.sourceText.value.trim();
  if (!text) {
    setStatus(t('enterText'));
    return;
  }

  const phrase = findPhrase(text);
  if (phrase) {
    el.sourceText.value = phrase[state.source];
    showResult(phrase[state.source], phrase[state.target]);
    return;
  }

  setStatus(t('translating'));
  el.translateBtn.disabled = true;
  try {
    const params = new URLSearchParams({
      q: text,
      langpair: `${LANGS[state.source].api}|${LANGS[state.target].api}`,
    });
    const response = await fetch(`${TRANSLATE_URL}?${params}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (data.responseStatus && data.responseStatus !== 200) {
      throw new Error(data.responseDetails || `статус ${data.responseStatus}`);
    }
    const translated = data.responseData && data.responseData.translatedText;
    if (!translated) throw new Error('пустой ответ');
    showResult(text, translated);
  } catch (error) {
    console.error(error);
    el.result.hidden = true;
    setStatus(`${t('translateError')} (${error.message}). ${t('checkInternet')}`);
  } finally {
    el.translateBtn.disabled = false;
  }
}

function startListening() {
  if (!SpeechRecognitionAPI) {
    setStatus(t('speechUnsupported'));
    return;
  }

  const recognizer = new SpeechRecognitionAPI();
  recognizer.lang = LANGS[state.source].speech;
  recognizer.interimResults = true;
  recognizer.continuous = false;
  recognizer.maxAlternatives = 1;

  let finalText = '';

  recognizer.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalText += result[0].transcript;
      } else {
        interim += result[0].transcript;
      }
    }
    el.sourceText.value = (finalText + interim).trim();
  };

  recognizer.onerror = (event) => {
    if (event.error === 'aborted') return;
    const key = MIC_ERRORS[event.error];
    setStatus(key ? t(key) : event.error);
  };

  recognizer.onend = () => {
    if (state.recognizer !== recognizer) return;
    state.recognizer = null;
    updateMicLabel();
    if (el.sourceText.value.trim()) translate();
  };

  try {
    state.recognizer = recognizer;
    setStatus('');
    recognizer.start();
  } catch (error) {
    state.recognizer = null;
    setStatus(error.message);
  }
  updateMicLabel();
}

// Остановка без перевода: используется при смене языка.
function stopMic() {
  const recognizer = state.recognizer;
  if (!recognizer) return;
  state.recognizer = null;
  recognizer.abort();
  updateMicLabel();
}

function toggleMic() {
  if (state.recognizer) {
    state.recognizer.stop();
  } else {
    startListening();
  }
}

el.mic.addEventListener('click', toggleMic);
el.translateBtn.addEventListener('click', translate);
el.playBtn.addEventListener('click', () => speak(el.resultTarget.textContent, state.target));
el.shareNative.addEventListener('click', shareNative);
el.shareWa.addEventListener('click', shareWhatsApp);
el.shareMail.addEventListener('click', shareEmail);
el.shareCopy.addEventListener('click', copyText);
if (!navigator.share) el.shareNative.hidden = true;
el.swapBtn.addEventListener('click', swapLanguages);
el.sourceText.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    translate();
  }
});

loadPrefs();
el.sourceText.lang = state.source;
el.sourceText.dir = LANGS[state.source].dir;
applyUI();
</script>
</body>
</html>
