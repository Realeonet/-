<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסע הכוכבים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6fdd">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e3;--ink:#222;--muted:#666;--line:#e4dccb;--blue:#2f6fdd;--green:#2e9e5b;--orange:#e0883a;--gold:#f5b400}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.75 Heebo,system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:30px;font-weight:900;margin:12px 0 8px;line-height:1.3}
h2{font-size:24px;font-weight:900;margin:8px 0}
p{margin:8px 0}
.center{text-align:center}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px 20px;margin:14px 0;box-shadow:0 4px 0 var(--line)}
.stars{font-size:26px;font-weight:900;color:#b07a00;margin:0}
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:right;background:#fff;color:inherit;font:inherit;border:3px solid var(--line);border-radius:22px;padding:18px 20px;margin:14px 0;cursor:pointer;box-shadow:0 5px 0 var(--line);min-height:88px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.big .ic{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:40px;line-height:1}
.hero{background:linear-gradient(135deg,#2f6fdd,#7b5cf0);color:#fff;border-radius:24px;padding:20px 22px;margin:12px 0 4px;box-shadow:0 6px 0 #1d4fb0}
.hero-hi{font-size:26px;font-weight:900;margin:0}
.hero-stars{font-size:30px;font-weight:900;margin:4px 0}
.hero-next{margin:4px 0 12px;opacity:.95}
.bar{height:16px;background:rgba(255,255,255,.35);border-radius:10px;overflow:hidden}
.fill{display:block;height:100%;background:#ffd23f;border-radius:10px;transition:width .6s}
button:focus-visible,.choice:focus-visible{outline:4px solid #ffd23f;outline-offset:3px}
.big b{font-size:24px;display:block}
.big small{color:var(--muted);font-size:17px}
.btn{font:inherit;font-weight:700;font-size:22px;min-height:58px;padding:12px 22px;border:0;border-radius:18px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 4px 0 #1d4fb0;margin:8px 0;width:100%}
.btn.alt{background:#fff;color:var(--blue);border:3px solid var(--blue);box-shadow:none}
.btn:active{transform:translateY(2px)}
.speak{font:inherit;font-size:22px;font-weight:700;background:#fff3c4;color:var(--ink);border:3px solid var(--gold);border-radius:999px;padding:10px 20px;cursor:pointer;margin:6px 0;min-height:52px}
.en{font-family:'Atkinson Hyperlegible',Heebo,sans-serif;direction:ltr;letter-spacing:.05em}
.progress{display:flex;gap:8px;margin:6px 0 4px}
.progress span{flex:1;height:14px;border-radius:8px;background:var(--line)}
.progress span.done{background:var(--green)}
.progress span.now{background:var(--gold)}
.count{color:var(--muted);font-size:17px;margin:0 0 10px}
.big-word{font-size:56px;text-align:center;margin:10px 0;line-height:1.2}
.prompt{font-size:22px;font-weight:700;text-align:center;margin:10px 0}
.sentence{font-size:28px;font-weight:700;text-align:center;direction:ltr;font-family:'Atkinson Hyperlegible',Heebo,sans-serif;margin:12px 0}
.choices{display:grid;gap:12px;margin-top:14px}
.choice{font:inherit;font-size:22px;min-height:66px;padding:12px 14px;border-radius:18px;border:3px solid #cfc6b2;background:#fff;color:var(--ink);cursor:pointer}
.choice.ok{background:#d9f5e3;border-color:var(--green)}
.choice.nope{background:#fde7d3;border-color:var(--orange);opacity:.6}
.choice:disabled{cursor:default}
.msg{min-height:38px;font-size:24px;font-weight:700;text-align:center;margin:10px 0 0}
.hint{font-size:20px;color:var(--muted);text-align:center;margin:6px 0 0;min-height:30px}
.slots{display:flex;gap:6px;justify-content:center;direction:ltr;flex-wrap:wrap;margin:14px 0}
.slot{width:54px;height:66px;border-bottom:4px solid var(--ink);font:700 38px 'Atkinson Hyperlegible',sans-serif;display:flex;align-items:center;justify-content:center}
.tiles{display:flex;gap:10px;justify-content:center;direction:ltr;flex-wrap:wrap;margin-top:12px}
.tile{width:62px;height:62px;border-radius:16px;border:0;background:#c9e0ff;font:700 32px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;box-shadow:0 4px 0 #8fb6ea;color:var(--ink)}
.tile:disabled{visibility:hidden}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row .speak,.row .btn{width:auto;margin:6px 0}
.story{font-size:22px;line-height:2;background:#f3f8ff;border-radius:16px;padding:14px 18px;margin:10px 0}
.shake{animation:shake .4s}
.pop{animation:pop .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.choice.sel{border-color:var(--blue);background:#e4efff}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pair{font-size:20px;min-height:60px;padding:8px 10px}
.row .choice{width:auto;min-height:56px;font-size:22px;padding:10px 16px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.grade{font:inherit;font-size:22px;font-weight:700;min-height:56px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.grade.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pin{font:inherit;font-size:24px;width:100%;padding:12px 14px;border:3px solid var(--line);border-radius:14px;margin:8px 0 14px;background:#fff;color:var(--ink)}
ul{padding-right:22px}
li{margin:6px 0}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
</style>
</head>

  }

function h(tag, props, ...kids){
  const e = Object.assign(document.createElement(tag), props || {});
  e.append(...kids.flat().filter(k => k != null));
  return e;
}
function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function say(text, lang = 'en-US'){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}
const app = document.querySelector('#app');
function view(...nodes){
  app.replaceChildren(...nodes.flat().filter(n => n != null));
  window.scrollTo(0, 0);
}
function big(icon, title, sub, onclick, color = '#fff3c4'){
  const ic = h('span', {className:'ic', textContent:icon});
  ic.style.background = color;
  return h('button', {className:'big', onclick},
    ic,
    h('span', {}, h('b', {textContent:title}), h('small', {textContent:sub})));
}
function badgeText(){
  const cur = BADGES.filter(b => me.stars >= b.at).pop();
  const next = BADGES.find(b => b.at > me.stars);
  const now = cur ? cur.name : '🐣 התואר הראשון מחכה לך';
  return next ? `${now} · עוד ${next.at - me.stars} כוכבים עד ${next.name}` : now;
}

function confirmDelete(a){
  const pin = h('input', {type:'password', inputMode:'numeric', maxLength:4, placeholder:'הקוד הסודי של הפרופיל', className:'pin'});
  const msg = h('p', {className:'msg'});
  const del = () => {
    if(pin.value !== a.pin){
      msg.textContent = '🤔 הקוד לא נכון';
      pin.value = '';
      return;
    }
    if(!confirm(`למחוק את ${a.name}? כל ההתקדמות שלו תימחק.`)) return;
    store.accounts = store.accounts.filter(x => x !== a);
    save();
    if(me === a) me = null;
    manageAccounts();
  };
  pin.onkeydown = e => { if(e.key === 'Enter') del(); };
  view(
    h('button', {className:'btn alt', textContent:'⬅ חזרה', onclick:manageAccounts}),
    h('h1', {textContent:`מחיקת ${a.name}`}),
    h('div', {className:'card'},
      h('p', {textContent:'כדי למחוק, מקלידים את הקוד הסודי של הפרופיל. המחיקה לצמיתות.'}),
      pin,
      h('button', {className:'btn', textContent:'מחק לצמיתות', onclick:del}),
      msg),
  );
  pin.focus();
}

function login(a){

function newAccount(){

    if(!/^\d{4}$/.test(pin.value)){ msg.textContent = 'הקוד צריך להיות 4 ספרות'; return; }

// אחוז ההתקדמות אל התואר הבא
function progressPct(){
  const prev = BADGES.filter(b => me.stars >= b.at).pop()?.at || 0;
  const next = BADGES.find(b => b.at > me.stars);
  return next ? (me.stars - prev) / (next.at - prev) * 100 : 100;
}

function gradePicker(current, onPick){
  const btns = GRADES.map(g => h('button', {className:'grade' + (g.n === current ? ' on' : ''), textContent:g.name, onclick:() => {
    btns.forEach(b => b.classList.remove('on'));
    btns[g.n - 1].classList.add('on');
    onPick(g.n);
  }}));
  return h('div', {className:'grades'}, btns);
}

// סיבוב: 5 שאלות, כוכב על כל תשובה נכונה מהניסיון הראשון
// ===================================================================
let round = null;
let streak = 0; // רצף תשובות נכונות בלי טעות

function startRound(subject, theme){
  const build = {tanakh:tanakhRound, science:scienceRound, math:mathRound, hebrew:hebrewRound}[subject];
  const items = subject === 'en' ? englishRound(me.grade, theme) : build(me.grade);
  if(!items) return noContent(subject);
  round = {subject, theme, items, i:0, stars:0};
  showItem();
}

function noContent(subject){
  const name = {en:'באנגלית', tanakh:'בתנ״ך', science:'במדעים', math:'במתמטיקה', hebrew:'בעברית'}[subject];
  view(
    h('button', {className:'btn alt', textContent:'⬅ חזרה לתפריט', onclick:home}),
    h('div', {className:'card center'},
      h('h2', {textContent:`עוד אין תוכן ${name} לכיתה ${gradeName(me.grade)}`}),
      h('p', {textContent:'התוכן לכיתה הזו יתווסף בהמשך.'})),
  );
}

function showItem(){
  const r = round;
  if(r.i >= r.items.length) return finish();

  const item = r.items[r.i];
  const box = h('div', {className:'card'});
  if(item.isNew) box.append(h('p', {className:'count', textContent:'🆕 מילה חדשה!'}));
  view(
    h('button', {className:'btn alt', textContent:'⬅ יציאה לתפריט', onclick:home}),
    h('p', {className:'count', textContent:`שאלה ${r.i + 1} מתוך ${r.items.length}`}),
    h('div', {className:'progress'}, r.items.map((_, k) =>
      h('span', {className: k < r.i ? 'done' : k === r.i ? 'now' : ''}))),
    box,
  );

  const next = firstTry => {
    if(firstTry){
      me.stars++;
      r.stars++;
      delete me.missed[item.key];
    }else{
      const m = me.missed[item.key] || {label:item.label, n:0};
      m.n++;
      me.missed[item.key] = m;
    }
    save();
    if(item.anchor) updateMastery(item.anchor.en, firstTry);
    streak = firstTry ? streak + 1 : 0;
    const praise = firstTry
      ? (streak >= 3 ? `🔥 רצף ${streak}! ⭐ +1 כוכב` : '⭐ מעולה! +1 כוכב')
      : '💪 בסדר, לומדים מזה!';
    box.append(h('p', {className:'msg pop', textContent: praise}));
    setTimeout(() => {
      if(round === r){
        r.i++;
        showItem();
      }
    }, firstTry ? 900 : 1600);
  };

  const renderers = {listen:listenItem, spell:spellItem, sentence:sentenceItem, bible:bibleItem,
    say:sayItem, pairs:pairsItem, hear:hearItem, order:orderItem, odd:oddItem};
  renderers[item.kind](box, item, next);
}

function finish(){
  const r = round;
  round = null;
  me.rounds++;
  if(r.subject === 'en') me.engSessions = (me.engSessions || 0) + 1;
  save();
  view(
    h('div', {className:'card center'},
      h('h1', {textContent:'סיבוב גמור! 🎉'}),
      h('p', {className:'stars', textContent:`קיבלת ${r.stars} כוכבים מתוך ${r.items.length}`}),
      h('p', {textContent:badgeText()})),
    breakCard(),
    h('button', {className:'btn', textContent:'עוד סיבוב 🚀', onclick:() => startRound(r.subject, r.theme)}),
    h('button', {className:'btn alt', textContent:'לתפריט', onclick:home}),
  );
}

function breakCard(){
  const out = h('p', {className:'center', textContent:'דקה אחת, ואז חוזרים 💪'});
  let secs = 60;
  let timer = null;
  const start = h('button', {className:'speak', textContent:'⏱️ התחל דקת הפסקה', onclick() {
    this.disabled = true;
    out.textContent = `נשארו ${secs} שניות`;
    timer = setInterval(() => {
      secs--;
      out.textContent = secs > 0 ? `נשארו ${secs} שניות` : 'נגמרה ההפסקה! מוכנים? 💪';
      if(secs <= 0) clearInterval(timer);
    }, 1000);
  }});
  return h('div', {className:'card center'},
    h('h2', {textContent:'הפסקת תנועה'}),
    h('p', {textContent:pick(BREAKS)}),
    start,
    out);
}

const pick = a => a[Math.random() * a.length | 0];

// בחירה מתוך כמה כפתורים. מחזיר done(firstTry) כשנגמר.
function choose(box, options, correct, done){
  let misses = 0, finished = false;
  const msg = h('p', {className:'msg'});
  const buttons = options.map(o => {
    const b = h('button', {className:'choice', textContent:o.label});
    b.onclick = () => {
      if(finished || b.disabled) return;
      if(o.v === correct){
        b.classList.add('ok');
        end(misses === 0);
      }else{
        misses++;
        b.classList.add('nope');
        b.disabled = true;
        if(misses < 2){
          msg.textContent = '🤔 כמעט! נסה שוב';
        }else{
          msg.textContent = '👀 התשובה הנכונה מסומנת בירוק';
          end(false);
        }
      }
    };
    return {b, v:o.v};
  });
  const end = first => {
    finished = true;
    buttons.forEach(x => {
      x.b.disabled = true;
      if(x.v === correct) x.b.classList.add('ok');
    });
    done(first);
  };
  box.append(h('div', {className:'choices'}, buttons.map(x => x.b)), msg);
}

// שמיעת מילה באנגלית ובחירת המשמעות בעברית
function listenItem(box, item, done){
  const w = item.word;
  box.append(
    h('p', {className:'big-word en', textContent:w.en}),
    h('p', {className:'prompt', textContent:'מה זה בעברית?'}),
    h('div', {className:'center'},
      h('button', {className:'speak', textContent:'🔊 שמע שוב', onclick:() => say(w.en)})),
  );
  setTimeout(() => say(w.en), 300);
  const options = shuffle([w, ...shuffle(item.pool.filter(x => x !== w)).slice(0, 2)])
    .map(x => ({v:x.en, label:`${x.emoji} ${x.he}`}));
  choose(box, options, w.en, done);
}

// רואים תמונה ומרכיבים את האיות מאותיות
function spellItem(box, item, done){
  const w = item.word;
  const letters = [...w.en];
  const extra = shuffle([...LETTERS].filter(c => !letters.includes(c))).slice(0, 3);
  const tiles = shuffle([...letters, ...extra]).map(ch => ({ch, el:h('button', {className:'tile', textContent:ch})}));
  const slots = letters.map(() => h('div', {className:'slot'}));
  const stack = [];
  const msg = h('p', {className:'msg'});
  let misses = 0, finished = false;

  const finishWith = first => {
    finished = true;
    tiles.forEach(t => t.el.disabled = true);
    slots.forEach((s, k) => s.textContent = letters[k]);
    say(w.en);
    done(first);
  };

  const check = () => {
    const guess = stack.map(x => x.ch).join('');
    if(guess === w.en){
      msg.textContent = '✅ יפה!';
      finishWith(misses === 0);
      return;
    }
    misses++;
    msg.textContent = '🤔 כמעט! שמע שוב 🔊';
    slots.forEach(s => s.classList.add('shake'));
    setTimeout(() => slots.forEach(s => s.classList.remove('shake')), 400);
    if(misses >= 2){
      msg.textContent = '👀 כך כותבים את המילה:';
      finishWith(false);
      return;
    }
    setTimeout(clear, 700);
  };

  const clear = () => {
    while(stack.length) undo();
  };

  const undo = () => {
    const last = stack.pop();
    if(!last) return;
    last.tile.el.disabled = false;
    slots[stack.length].textContent = '';
  };

  tiles.forEach(t => {
    t.el.onclick = () => {
      if(finished || stack.length >= letters.length) return;
      stack.push({ch:t.ch, tile:t});
      t.el.disabled = true;
      slots[stack.length - 1].textContent = t.ch;
      if(stack.length === letters.length) check();
    };
  });

  box.append(
    h('div', {className:'big-word', textContent:w.emoji}),
    h('p', {className:'prompt', textContent:`איך כותבים באנגלית: "${w.he}"?`}),
    h('div', {className:'center'},
      h('button', {className:'speak', textContent:'🔊 שמע את המילה', onclick:() => say(w.en)})),
    h('div', {className:'slots'}, slots),
    h('div', {className:'tiles'}, tiles.map(t => t.el)),
    h('div', {className:'row'},
      h('button', {className:'speak', textContent:'⌫ מחק אות', onclick:() => { if(!finished) undo(); }})),
    msg,
  );
  setTimeout(() => say(w.en), 300);
}

// השלמת משפט באנגלית
function sentenceItem(box, item, done){
  const hint = h('p', {className:'hint', textContent:''});

const ENG_KINDS = ['listen','spell','say','pairs','hear','odd','order','sentence'];
const MASS = ['water','milk','bread','cheese','sand','grass','fire','rain','snow','wind','juice','candy','chocolate','sea'];

const toWord = ([en, he, emoji, lvl, theme]) => ({en, he, emoji, lvl, theme});
// כל המילים בלי כפילויות, מהקלות לקשות. מילים נפתחות בהדרגה לפי מספר הסשנים שהושלמו
const ENG_ORDER = (() => {
  const seen = new Set();
  return [...ENG_BANK, ...(window.ENG_WORDS || [])]
    .map(toWord)
    .filter(w => !seen.has(w.en) && seen.add(w.en))
    .map((w, i) => ({w, i}))
    .sort((a, b) => a.w.lvl - b.w.lvl || a.i - b.i)
    .map(x => x.w);
})();
const unlockedCount = () => Math.min(ENG_ORDER.length, 60 + 20 * (me.engSessions || 0));
const engWords = grade => ENG_ORDER.slice(0, unlockedCount()).filter(w => w.lvl <= grade);
const themeWords = (grade, theme) => engWords(grade + 1).filter(w => w.theme === theme);

// משפט קצר שמכיל את המילה, לתרגול האזנה וסדר מילים
const DAYS_PARTS = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday','morning','afternoon','evening','night','noon','midnight'];
function phrase(w){
  if(['colors','feelings','describe'].includes(w.theme) || DAYS_PARTS.includes(w.en)) return `It is ${w.en}.`;
  if(w.theme === 'time') return `We have ${/^[aeiou]/.test(w.en) ? 'an' : 'a'} ${w.en}.`;
  if(w.theme === 'actions') return `I can ${w.en}.`;
  if(MASS.includes(w.en)) return `I see some ${w.en}.`;
  return `I see ${/^[aeiou]/.test(w.en) ? 'an' : 'a'} ${w.en}.`;
}
// אותו משפט עם מקום חסר במקום המילה, להשלמה
function blankPhrase(w){
  return phrase(w).replace(new RegExp(`(a|an|some) ${w.en}`), '___').replace(` ${w.en}`, ' ___');
}
// השלמת משפט שנבנית מהמילה עצמה, כך שיש אינסוף משפטים כאלה
function fillItem(w, all){
  const same = shuffle(all.filter(x => x.theme === w.theme && x !== w)).slice(0, 2);
  const others = shuffle(all.filter(x => x !== w && !same.includes(x))).slice(0, 2 - same.length);
  return {kind:'sentence', key:'f:' + w.en, label:w.en, anchor:w, s:blankPhrase(w),
    opts:shuffle([w, ...same, ...others]).map(x => x.en), a:w.en, he:w.he};
}

// מילים שנשלטו (ענו נכון בלי טעות) מופיעות פחות, מילים חדשות או שטעינו בהן מופיעות יותר
function updateMastery(word, ok){
  me.mastery = me.mastery || {};
  const m = me.mastery[word] || {ok:0};
  m.ok = ok ? m.ok + 1 : Math.max(0, m.ok - 1);
  me.mastery[word] = m;
  me.recent = [word, ...(me.recent || [])].slice(0, 25);
  save();
}
function pickWords(pool, n){
  const recent = me.recent || [];
  const mastery = me.mastery || {};
  return pool
    .map(w => ({w, s: (recent.includes(w.en) ? 0.1 : 1) / (1 + (mastery[w.en]?.ok || 0)) * (0.5 + Math.random())}))
    .sort((a, b) => b.s - a.s)
    .slice(0, n)
    .map(x => x.w);
}

function englishRound(grade, theme){
  const all = engWords(grade);
  let pool = theme && theme !== 'mix' ? themeWords(grade, theme) : all;
  if(pool.length < 4) pool = all;
  // 3 מילים חדשות בכל סשן (שעוד לא נתקלנו בהן), השאר מהמילים שכבר מוכרות
  const mastery = me.mastery || {};
  const fresh = pool.filter(w => !mastery[w.en]);
  const newOnes = fresh.length >= 3 ? pickWords(fresh, 3) : [];
  const anchors = [...newOnes, ...pickWords(pool.filter(w => !newOnes.includes(w)), 10 - newOnes.length)];
  if(anchors.length < 10) anchors.push(...pickWords(all.filter(w => !anchors.includes(w)), 10 - anchors.length));
  const sents = shuffle([...ENG_SENT, ...SENTENCES].filter(s => (s.lvl || 5) <= grade));
  const kinds = shuffle([...ENG_KINDS, ...shuffle(ENG_KINDS).slice(0, 2)]);
  let si = 0;
  return anchors.map((w, i) => {
    const kind = kinds[i];
    const isNew = newOnes.includes(w);
    if(kind === 'sentence'){
      // חצי מההשלמות נבנות מהמילה עצמה, כך שיש הרבה יותר תרגולים
      if(!sents.length || Math.random() < 0.5) return {...fillItem(w, all), isNew};
      const s = sents[si++ % sents.length];
      return {kind, key:'s:' + s.s, label:s.s, ...s, isNew:false};
    }
    const base = {kind, anchor:w, word:w, key:w.en, label:w.en, pool:all, isNew};
    if(kind === 'pairs') return {...base, others: shuffle(all.filter(x => x !== w)).slice(0, 3)};
    if(kind === 'hear') return {...base, options: shuffle([w, ...shuffle(all.filter(x => x !== w && x.emoji !== w.emoji)).slice(0, 2)]).map(x => ({v:x.en, label:x.emoji}))};
    if(kind === 'order') return {...base, phrase: phrase(w)};
    if(kind === 'odd'){
      const T = shuffle(THEMES.map(t => t.key).filter(k => k !== w.theme && all.filter(x => x.theme === k).length >= 3))[0];
      if(!T) return {...base, kind:'listen'};
      const trio = shuffle(all.filter(x => x.theme === T)).slice(0, 3);
      return {...base, options: shuffle([w, ...trio]).map(x => ({v:x.en, label:`${x.emoji} ${x.en}`}))};
    }
    return base;
  });
}

// זיהוי דיבור: הילד אומר את המילה. אם הדפדפן לא תומך, אפשר לאשר ידנית
function sayItem(box, item, done){
  const w = item.word;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let misses = 0, finished = false;
  const msg = h('p', {className:'msg'});
  const finish = first => {
    if(finished) return;
    finished = true;
    say(w.en);
    done(first);
  };
  const listen = () => {
    if(!SR){
      msg.textContent = 'הדפדפן לא מזהה דיבור. אמרו את המילה ולחצו ✅';
      return;
    }
    const rec = new SR();
    rec.lang = 'en-US';
    rec.maxAlternatives = 3;
    msg.textContent = '🎤 מקשיבים...';
    rec.onresult = e => {
      const said = [...e.results[0]].map(a => a.transcript.toLowerCase().trim());
      if(said.some(s => s.includes(w.en))){
        msg.textContent = '🗣️ מעולה!';
        finish(misses === 0);
      }else{
        misses++;
        msg.textContent = `שמעתי "${said[0]}". נסו שוב 🎤`;
        if(misses >= 2){
          msg.textContent = `התשובה: ${w.en}`;
          finish(false);
        }
      }
    };
    rec.onerror = () => { msg.textContent = 'לא שמענו. נסו שוב, או לחצו ✅ אם אמרתם'; };
    rec.start();
  };
  box.append(
    h('div', {className:'big-word', textContent:w.emoji}),
    h('p', {className:'prompt', textContent:`איך אומרים באנגלית: "${w.he}"?`}),
    h('div', {className:'row'},
      h('button', {className:'speak', textContent:'🎤 אני אומר', onclick:listen}),
      h('button', {className:'speak', textContent:'🔊 תקשיב קודם', onclick:() => say(w.en)}),
      h('button', {className:'speak', textContent:'✅ אמרתי', onclick:() => finish(misses === 0)})),
    msg,
  );
  setTimeout(() => say(w.en), 300);
}

// חיבור מילים באנגלית לתרגום שלהן בעברית
function pairsItem(box, item, done){
  const words = [item.word, ...item.others];
  const left = shuffle(words).map(w => ({id:w.en, el:h('button', {className:'choice pair', textContent:w.en})}));
  const right = shuffle(words).map(w => ({id:w.en, el:h('button', {className:'choice pair', textContent:`${w.emoji} ${w.he}`})}));
  let sel = null, misses = 0, matched = 0, finished = false;
  const msg = h('p', {className:'msg'});
  const onPick = (btn, id, side) => {
    if(finished || btn.disabled) return;
    if(!sel || sel.side === side){
      if(sel) sel.btn.classList.remove('sel');
      sel = {btn, id, side};
      btn.classList.add('sel');
      return;
    }
    if(sel.id === id){
      [sel.btn, btn].forEach(b => { b.classList.remove('sel'); b.classList.add('ok'); b.disabled = true; });
      matched++;
      sel = null;
      msg.textContent = '✅ זוג!';
      if(matched === words.length){
        finished = true;
        done(misses === 0);
      }
    }else{
      misses++;
      const a = sel.btn;
      a.classList.remove('sel');
      a.classList.add('nope');
      btn.classList.add('nope');
      setTimeout(() => { a.classList.remove('nope'); btn.classList.remove('nope'); }, 500);
      sel = null;
      msg.textContent = '🤔 לא זוג. נסו שוב';
    }
  };
  left.forEach(x => x.el.onclick = () => onPick(x.el, x.id, 'L'));
  right.forEach(x => x.el.onclick = () => onPick(x.el, x.id, 'R'));
  box.append(
    h('p', {className:'prompt', textContent:'חברו כל מילה לתרגום שלה'}),
    h('div', {className:'pairs'},
      h('div', {className:'col'}, left.map(x => x.el)),
      h('div', {className:'col'}, right.map(x => x.el))),
    msg,
  );
}

function orderItem(box, item, done){
  const text = item.phrase;
  const tokens = text.replace('.', '').split(' ');
  const tiles = shuffle(tokens.map((t, i) => ({t, el:h('button', {className:'choice', textContent:t})})));
  const built = [];
  const shown = h('p', {className:'sentence', textContent:'…'});
  let misses = 0, finished = false;
  const msg = h('p', {className:'msg'});
  tiles.forEach(x => x.el.onclick = () => {
    if(finished || x.el.disabled) return;
    if(x.t === tokens[built.length]){
      built.push(x.t);
      x.el.disabled = true;
      x.el.classList.add('ok');
      shown.textContent = built.join(' ');
      if(built.length === tokens.length){
        finished = true;
        msg.textContent = '✅ יפה!';
        say(text);
        done(misses === 0);
      }
    }else{
      misses++;
      x.el.classList.add('nope');
      setTimeout(() => x.el.classList.remove('nope'), 400);
      msg.textContent = '🤔 לא זה. שימו לב לסדר';
      if(misses >= 2){
        finished = true;
        msg.textContent = `👀 המשפט: ${text}`;
        say(text);
        done(false);
      }
    }
  });
  box.append(
    h('div', {className:'big-word', textContent:item.word.emoji}),
    h('p', {className:'prompt', textContent:'סדרו את המילים למשפט 🧩'}),
    h('div', {className:'center'}, h('button', {className:'speak', textContent:'🔊 הקשב', onclick:() => say(text)})),
    shown,
    h('div', {className:'row'}, tiles.map(x => x.el)),
    msg,
  );
  setTimeout(() => say(text), 300);
}

// מי לא שייך לקבוצה
function oddItem(box, item, done){
  box.append(
    h('div', {className:'big-word', textContent:'🧩'}),
    h('p', {className:'prompt', textContent:'איזו מילה לא שייכת לקבוצה?'}),
  );
  choose(box, item.options, item.word.en, done);
}

function storyRound(subject, grade){
  const c = CONTENT[subject][grade];
  if(!c) return null;
  return shuffle(c.stories).slice(0, 5).map(b => ({kind:'bible', key:subject + ':' + b.title, label:b.title, b}));
}
const tanakhRound = grade => storyRound('tanakh', grade);
const scienceRound = grade => storyRound('science', grade);
const mathRound = grade => storyRound('math', grade);
const hebrewRound = grade => storyRound('hebrew', grade);
